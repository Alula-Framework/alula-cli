name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by flight and flight-data so a breaking change there fails HERE,
  # on the pull request that caused it, rather than in a new user's first ten
  # minutes with a downloaded starter project.
  #
  # The caller passes the commit it wants the templates built against.
  # Defaulting to `main` is what a standalone run of this workflow does, and
  # it is also what made the first version of this wiring pointless: checking
  # out `main` from a pull request's CI tests the branch that is already
  # merged, not the change under review.
  workflow_call:
    inputs:
      flight_ref:
        description: "The flight commit to build the templates against."
        type: string
        default: main
      flight_data_ref:
        description: "The flight-data commit to build the templates against."
        type: string
        default: main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: ${{ matrix.tier }} (Swift 6.3.3)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        tier: [skeleton, basics, demo]

    steps:
      # The official Swift images are slim: no python3 for the CI/ scripts,
      # and no curl — which three tutorial checkpoints use to prove a route
      # actually answers. A missing curl fails those checkpoints as exit 127,
      # which reads as "the tutorial is broken" rather than "the image is
      # thin".
      - name: Install python3 and curl
        run: apt-get update -qq && apt-get install -y -qq python3 curl

      # Even with flight and flight-data checked out as siblings, their own
      # dependencies — hangar, swift-changeset — are resolved by URL. Every
      # one of those repositories is public now, so the token is a
      # rate-limit courtesy rather than a requirement: a fork with no secret
      # resolves fine.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          path: flight-cli

      - uses: actions/checkout@v4
        with:
          repository: Flight-Framework/flight
          ref: ${{ inputs.flight_ref || 'main' }}
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: flight

      - uses: actions/checkout@v4
        with:
          repository: Flight-Framework/flight-data
          ref: ${{ inputs.flight_data_ref || 'main' }}
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: flight-data

      - uses: actions/checkout@v4
        with:
          repository: Flight-Framework/hangar
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Hangar/hangar

      - uses: actions/checkout@v4
        with:
          repository: Flight-Framework/swift-changeset
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Data/swift-changeset

      # Builds and tests the tier against the checked-out working copies, not
      # against a published tag. Until v0.1.0 is tagged this is the only way
      # to verify them at all; after it, it is what catches a break before
      # the release rather than after.
      - name: Verify template
        working-directory: flight-cli
        run: ./CI/verify-templates.sh ${{ matrix.tier }}

  tutorial:
    name: Tutorial matches the templates
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      # The official Swift images are slim: no python3 for the CI/ scripts,
      # and no curl — which three tutorial checkpoints use to prove a route
      # actually answers. A missing curl fails those checkpoints as exit 127,
      # which reads as "the tutorial is broken" rather than "the image is
      # thin".
      - name: Install python3 and curl
        run: apt-get update -qq && apt-get install -y -qq python3 curl

      - uses: actions/checkout@v4

      # Cheap, and it catches the failure that actually happened last time:
      # a tutorial telling you to create files that no longer exist.
      - name: Verify tutorial
        run: ./CI/verify-tutorial.sh

  cli:
    name: CLI
    runs-on: ubuntu-latest
    container: swift:6.3.3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flight
          POSTGRES_DB: migrationcheck
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # The official Swift images are slim: no python3 for the CI/ scripts,
      # and no curl — which three tutorial checkpoints use to prove a route
      # actually answers. A missing curl fails those checkpoints as exit 127,
      # which reads as "the tutorial is broken" rather than "the image is
      # thin".
      - name: Install python3 and curl
        run: apt-get update -qq && apt-get install -y -qq python3 curl

      - uses: actions/checkout@v4

      # The generated projects resolve flight and flight-data by URL. Both
      # are public now, so the token only raises the anonymous rate limit.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - name: Unit tests
        run: swift test

      # The embedded copy of templates/ must match templates/ itself,
      # or `flight new` emits something CI never verified.
      - name: Embedded templates are current
        run: ./CI/generate-embedded-templates.sh --check

      # Builds and tests what `flight new` actually emits — a different
      # artifact from the templates, because the CLI rewrites names and paths.
      - name: Generated projects build and test
        run: ./CI/verify-generated-projects.sh

      # The migrate commands delegate to the project's own migrate executable,
      # so the only way to know the delegation works is to run it against a
      # real database.
      - name: Migrate commands work end to end
        env:
          FLIGHT_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/migrationcheck
        run: ./CI/verify-migrate.sh

      # Runs the tutorial's checkpoints rather than only checking that the
      # names in them resolve. Two dead commands sat in a checkpoint for weeks
      # because nothing executed them.
      - name: Tutorial checkpoints run
        env:
          FLIGHT_TEST_DATABASE_URL: postgres://postgres:flight@postgres:5432/migrationcheck
        run: ./CI/verify-checkpoints.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Blocking, not advisory: this repository is clean, and the way to keep
      # it that way is to fail on the first violation rather than accumulate a
      # backlog nobody reads.
      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests


  macos:
    name: Build on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # swiftly rather than swift-actions/setup-swift: this package declares
      # swift-tools-version 6.3, and setup-swift only indexes up to 6.2.
      - name: Install Swift
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.3 --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: swift --version

      # This job matters more than the other packages' macOS builds: a CLI
      # people install with Homebrew has to compile on the platform Homebrew
      # runs on, and nothing had ever compiled it there.
      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test
